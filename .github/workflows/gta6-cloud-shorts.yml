name: GTA6 cloud Shorts — isolated smoke test

on:
  push:
    branches: [gta6-cloud-shorts]
    paths:
      - "cloud-shorts/**"
      - ".github/workflows/gta6-cloud-shorts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-shorts-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-render:
    name: Render authorized synthetic sample without local PC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate safe synthetic test source (not third-party Twitch footage)
        run: |
          mkdir -p test-input output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=1280x720:rate=24' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 4 -c:v libx264 -preset ultrafast -crf 29 \
            -c:a aac -b:a 96k test-input/sample.mp4
          printf 'Synthetic original material generated by ffmpeg for build testing.\n' > test-input/sample.license.txt
          cat > test-input/sample.meta.json <<'JSON'
          {
            "streamer": "DEMO",
            "hook": ["GTA VI — TEST", "NO ACTUAL CLIP"],
            "title": "A-LAB технический тест рендера",
            "description": "Это тест облачного рендера на искусственном видео.",
            "duration_sec": 3.5,
            "crop_x": 260,
            "streamer_hashtag": "ALAB"
          }
          JSON
      - name: Render vertical test video
        run: |
          python cloud-shorts/render.py \
            --source test-input/sample.mp4 \
            --license test-input/sample.license.txt \
            --metadata test-input/sample.meta.json \
            --output output/gta6-cloud-smoke.mp4
      - name: Validate video, source audio and no auto subtitles
        run: |
          python cloud-shorts/verify.py \
            --video output/gta6-cloud-smoke.mp4 \
            --metadata output/youtube.json
      - name: Attach test result (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: gta6-cloud-shorts-demo
          path: |
            output/gta6-cloud-smoke.mp4
            output/youtube.json
          retention-days: 7
          if-no-files-found: error
